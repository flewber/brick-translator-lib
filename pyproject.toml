[project]
name = "brick-translator"
version = "0.2.0"
description = "Translate brick part and color IDs between naming schemes (Rebrickable, BrickLink, BrickOwl, Brickset, LDraw, LEGO)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
fetch = ["rebrick"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
